name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only a newer push to the same pull request cancels a run; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Fake values only. The build does not call Supabase. Real secrets stay out of CI.
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          SUPABASE_URL: https://ci-dummy.invalid
          SUPABASE_SERVICE_ROLE_KEY: ci-dummy-service-role-key
          CRON_SECRET: ci-dummy-cron-secret
          IP_HASH_SALT: ci-dummy-ip-hash-salt
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
          HELPER_SESSION_SECRET: ci-dummy-helper-secret

  db:
    name: supabase test db
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Local Supabase CLI database only. These values are fake. No project ref, no production keys.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.72.7

      - name: Start database
        run: supabase db start
        env:
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-dummy-google-client
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-dummy-google-secret

      - name: pgTAP
        run: supabase test db
        env:
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-dummy-google-client
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-dummy-google-secret

  # Playwright (e2e/) is not run. The suite creates handoffs through
  # /api/handoffs, which needs a real Supabase project. Do not add secrets
  # to this file. A later pull request can uncomment the job below and pass
  # SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, IP_HASH_SALT, and CRON_SECRET
  # from repository secrets. Playwright 1.64 ships a newer WebKit, so install
  # browsers with deps instead of reusing an older browser cache:
  #   npx playwright install --with-deps
  # (desktop Chrome and Pixel 7 use Chromium; iPhone 14 uses WebKit.)
