name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only a newer push to the same pull request cancels a run; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Fake values only. The build does not call Supabase. Real secrets stay out of CI.
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          SUPABASE_URL: https://ci-dummy.invalid
          SUPABASE_SERVICE_ROLE_KEY: ci-dummy-service-role-key
          CRON_SECRET: ci-dummy-cron-secret
          IP_HASH_SALT: ci-dummy-ip-hash-salt
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
          HELPER_SESSION_SECRET: ci-dummy-helper-secret

  db:
    name: supabase test db
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Local Supabase CLI database only. These values are fake. No project ref, no production keys.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.72.7

      - name: Start database
        run: supabase db start
        env:
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-dummy-google-client
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-dummy-google-secret

      - name: pgTAP
        run: supabase test db
        env:
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-dummy-google-client
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-dummy-google-secret

  # Playwright (e2e/) on a throwaway local Supabase stack, on every pull request. No secrets: the
  # stack's keys come from `supabase status`, the app's own secrets are random for this run only,
  # and the fictional caregivers sign in with a password that only this runner's database allows.
  # Desktop Chrome and Pixel 7 use Chromium; iPhone 14 uses WebKit.
  e2e:
    name: playwright
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-dummy-google-client
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-dummy-google-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.72.7

      # Password sign-in on this runner's database only (the committed config keeps it off), so the
      # tests can sign in a fictional caregiver without Google.
      - name: Start Supabase
        run: |
          sed -i '/^\[auth.email\]/,/^\[/ s/^enable_signup = false/enable_signup = true/' supabase/config.toml
          supabase start -x studio,imgproxy,vector,logflare,supavisor,edge-runtime,inbucket,realtime

      - name: Test settings
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "HELPER_SESSION_SECRET=$(openssl rand -hex 32)"
            echo "CIRCLE_KEY_SECRET=$(openssl rand -hex 32)"
            echo "CRON_SECRET=$(openssl rand -hex 16)"
            echo "IP_HASH_SALT=$(openssl rand -hex 16)"
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3005"
          } > .env.local

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: End-to-end tests
        run: npm run test:e2e
